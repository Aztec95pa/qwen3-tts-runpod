<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qwen3-TTS Voice Service</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f6fa; color: #1e1e1e; }
    .wrap { max-width: 980px; margin: 0 auto; }
    h1 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .panel { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
    textarea, input, select, button { width: 100%; box-sizing: border-box; }
    textarea { min-height: 90px; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .status { white-space: pre-wrap; font-size: 12px; padding: 10px; background: #f4f4f4; border-radius: 6px; }
    audio { width: 100%; }
    .small { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Qwen3-TTS 声クローンサービス（ローカル）</h1>
    <p class="small">参考音声をアップロードして「即時合成」。保存すると voice_id を再利用できます。</p>

    <div class="grid">
      <section class="panel">
        <h2>即時クローン＆読み上げ</h2>
        <form id="immediate-form">
          <div class="row">
            <div>
              <label>参考音声（mp3/wav）</label>
              <input type="file" name="ref_audio" accept="audio/*" required />
            </div>
            <div>
              <label>言語</label>
              <input name="language" value="Auto" />
            </div>
          </div>
          <label>参考音声テキスト（未入力時はASR自動文字起こし）</label>
          <textarea name="ref_text" placeholder="こんにちは、テスト音声です。"></textarea>
          <label>合成したい文章（本文）</label>
          <textarea name="text" required>これはテストです。ご確認ください。</textarea>
          <div class="row">
            <div><label><input type="checkbox" name="x_vector_only" /> x-vector only（参考テキスト不要）</label></div>
            <div><label><input type="checkbox" name="save_profile" checked /> 声を保存（voice_idを発行）</label></div>
            <div><label><input type="checkbox" name="save_to_firebase" /> Firebaseに保存</label></div>
          </div>
          <div class="row">
            <div>
              <label>temperature</label>
              <input type="number" step="0.01" min="0.0" max="2.0" name="temperature" value="0.9" />
            </div>
            <div>
              <label>top_p</label>
              <input type="number" step="0.01" min="0" max="1" name="top_p" value="1.0" />
            </div>
            <div>
              <label>top_k</label>
              <input type="number" name="top_k" min="1" max="500" value="50" />
            </div>
          </div>
          <button type="submit">即時生成</button>
        </form>
        <p>出力音声</p>
        <audio id="immediate-player" controls></audio>
        <div id="immediate-status" class="status"></div>
      </section>

      <section class="panel">
        <h2>保存済み声で再生成</h2>
        <form id="speak-form">
          <label>voice_id</label>
          <input type="text" name="voice_id" required />
          <label>合成文章</label>
          <textarea name="text" required>こんにちは。保存している音声で読み上げます。</textarea>
          <label>言語</label>
          <input name="language" value="Auto" />
          <div class="row">
            <div><label><input type="checkbox" name="save_to_firebase" /> Firebaseに保存</label></div>
          </div>
          <button type="submit">再生成</button>
        </form>
        <p>出力音声</p>
        <audio id="speak-player" controls></audio>
        <div id="speak-status" class="status"></div>
      </section>
    </div>
  </div>

  <script>
    const toBool = (v) => v === true || v === "on" || v === "true" || v === "1";

    function formToBool(form, name) {
      return toBool(form[name].checked);
    }

    function setStatus(id, payload) {
      document.getElementById(id).textContent = JSON.stringify(payload, null, 2);
    }

    async function postForm(url, formId, statusId, audioId) {
      const form = document.getElementById(formId);
      const fd = new FormData(form);
      fd.set("x_vector_only", String(formToBool(form, "x_vector_only")));
      if (form.elements.namedItem("save_profile")) {
        fd.set("save_profile", String(formToBool(form, "save_profile")));
      }
      if (form.elements.namedItem("save_to_firebase")) {
        fd.set("save_to_firebase", String(formToBool(form, "save_to_firebase")));
      }
      const res = await fetch(url, { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) {
        setStatus(statusId, data);
        return;
      }
      const blob = `data:audio/wav;base64,${data.audio_base64}`;
      const player = document.getElementById(audioId);
      player.src = blob;
      setStatus(statusId, data);
    }

    async function postJson(url, formId, statusId, audioId) {
      const form = document.getElementById(formId);
      const body = {
        voice_id: form.voice_id.value,
        text: form.text.value,
        language: form.language.value || "Auto",
        temperature: parseFloat(form.temperature ? form.temperature.value : undefined),
        top_k: parseInt(form.top_k ? form.top_k.value : undefined),
        top_p: parseFloat(form.top_p ? form.top_p.value : undefined),
        save_to_firebase: formToBool(form, "save_to_firebase"),
      };
      const res = await fetch(url, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        setStatus(statusId, data);
        return;
      }
      const blob = `data:audio/wav;base64,${data.audio_base64}`;
      const player = document.getElementById(audioId);
      player.src = blob;
      setStatus(statusId, data);
    }

    document.getElementById("immediate-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      await postForm("/api/v1/voices/immediate", "immediate-form", "immediate-status", "immediate-player");
    });

    document.getElementById("speak-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      await postJson("/api/v1/speech", "speak-form", "speak-status", "speak-player");
    });
  </script>
</body>
</html>
